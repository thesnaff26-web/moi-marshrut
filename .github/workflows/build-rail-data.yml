name: Build Rail Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write

jobs:
  build-far-east:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install osmium

      - name: Download Far Eastern Federal District OSM
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            -o far-east.osm.pbf \
            https://download.geofabrik.de/russia/far-eastern-fed-district-latest.osm.pbf

      - name: Build rail data
        run: |
          mkdir -p rail-data
          python tools/build_rail_data_v1.py far-east.osm.pbf rail-data/ru_far_east.json

      - name: Update rail manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("rail-data/rail_manifest.json")
          data = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {
              "schema": "rabocheevremya.rail-data",
              "version": 1,
              "status": "beta",
              "country": "RU",
              "coordinate_system": "WGS84",
              "picket_length_m": 100,
              "regions": []
          }
          regions = [r for r in data.get("regions", []) if r.get("id") != "ru_far_east"]
          regions.append({
              "id": "ru_far_east",
              "name": "Дальневосточный федеральный округ",
              "file": "ru_far_east.json",
              "status": "beta",
              "source": "OpenStreetMap / Geofabrik"
          })
          data["regions"] = regions
          data["version"] = int(data.get("version", 0)) + 1
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rail-data/rail_manifest.json rail-data/ru_far_east.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Far East rail data"
            git push
          fi
