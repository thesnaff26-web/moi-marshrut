name: Build Rail Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write

jobs:
  build-rail-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install osmium

      # ---------- ДАЛЬНИЙ ВОСТОК ----------

      - name: Download Far Eastern Federal District
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            -o far-east.osm.pbf \
            https://download.geofabrik.de/russia/far-eastern-fed-district-latest.osm.pbf

      - name: Build Far East rail data
        run: |
          mkdir -p rail-data
          python tools/build_rail_data_v1.py \
            far-east.osm.pbf \
            rail-data/ru_far_east.json

      - name: Remove Far East source
        run: rm -f far-east.osm.pbf

      # ---------- СИБИРЬ ----------

      - name: Download Siberian Federal District
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            -o siberia.osm.pbf \
            https://download.geofabrik.de/russia/siberian-fed-district-latest.osm.pbf

      - name: Build Siberia rail data
        run: |
          python tools/build_rail_data_v1.py \
            siberia.osm.pbf \
            rail-data/ru_siberia.json

      - name: Remove Siberia source
        run: rm -f siberia.osm.pbf

      # ---------- МАНИФЕСТ ----------

      - name: Update rail manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("rail-data/rail_manifest.json")

          data = {
              "schema": "rabocheevremya.rail-data",
              "version": 2,
              "status": "beta",
              "country": "RU",
              "coordinate_system": "WGS84",
              "picket_length_m": 100,
              "coverage": [
                  "Дальневосточный федеральный округ",
                  "Сибирский федеральный округ"
              ],
              "regions": [
                  {
                      "id": "ru_far_east",
                      "name": "Дальневосточный федеральный округ",
                      "file": "ru_far_east.json",
                      "status": "beta",
                      "source": "OpenStreetMap / Geofabrik"
                  },
                  {
                      "id": "ru_siberia",
                      "name": "Сибирский федеральный округ",
                      "file": "ru_siberia.json",
                      "status": "beta",
                      "source": "OpenStreetMap / Geofabrik"
                  }
              ]
          }

          p.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      # ---------- СОХРАНЕНИЕ ----------

      - name: Commit generated databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            rail-data/rail_manifest.json \
            rail-data/ru_far_east.json \
            rail-data/ru_siberia.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Far East and Siberia rail data"
            git push
          fi
